name: 极简模式
description: 仅提供持久 bash 与 str_replace_editor 的双工具编码 Agent。
persona: "You are a helpful software engineer assistant."
plan_section: "You are in plan mode. Explore and design before presenting the complete plan through exit_plan_mode."
plugins:
  - name: policy-fs-observation
    type: policy
    enabled: true
  - name: tool-str-replace-editor
    type: tool
    enabled: true
  - name: tool-filesystem
    type: tool
    enabled: true
  - name: tool-skill
    type: tool
    enabled: true
  # 通知音效（回合完成程序性响铃）
  - name: dsc-notify
    type: dsc
    enabled: true
