name: ptc mode
description: 标准模式派生——开启 PTC（程序化工具组合）呈现：引导模型用 run_code 写 Lua 一把过组合多步，同时保留单个工具作 fallback。
persona: "You are an AI agent powered by DSC, running in PTC (programmatic tool composition) mode. For multi-step or batched work, prefer composing ONE Lua script and running it via run_code instead of issuing many individual tool calls. Inside run_code every tool is available as a same-name Lua function; compose them programmatically and return a structured result. Individual tools remain available when a single call is clearer."
plan_section: "You are in PTC mode. Design the run_code Lua program before running: decide which tools to call programmatically, their argument shapes, and the top-level return value."
plugins:
  - name: policy-fs-observation
    type: policy
    enabled: true
  # 超时决策插件：shell/subagent 活跃续命空闲预算（DSC_SHELL_TIMEOUT / DSC_SUBAGENT_IDLE_TIMEOUT，0s 禁用）
  - name: policy-timeout
    type: policy
    enabled: true
  # 外置决策插件：超长工具结果外置为文件（阈值 DSC_SPILL_THRESHOLD 字符，0 禁用；取回走 view）
  - name: policy-spill
    type: policy
    enabled: true
  # 重复工具调用提醒（advisory 决策插件，dsc-system 驻留）：连续同参重复调用
  # 达阈值时注入提醒（DSC_REPEAT_THRESHOLDS 缺省 3,5,8 / DSC_REPEAT_EXCLUDE
  # 缺省 todo_write）；不否决不改写，用户插话自动重置
  - name: dsc-system
    type: dsc
    enabled: true
  - name: tool-str-replace-editor
    type: tool
    enabled: true
  - name: tool-filesystem
    type: tool
    enabled: true
  - name: tool-browser-use
    type: tool
    enabled: true
  - name: tool-computer-use
    type: tool
    enabled: true
  - name: tool-lisp-eval
    type: tool
    enabled: true
  - name: tool-skill
    type: tool
    enabled: true
  # 通知音效（回合完成程序性响铃）
  - name: dsc-notify
    type: dsc
    enabled: true
  - name: tool-lua-host
    type: tool
    enabled: true
    binary_path: ./plugins/tool-lua-host/tool-lua-host.exe
  - name: tool-harness-webui
    type: tool
    enabled: true
    binary_path: ./plugins/tool-harness-webui/tool-harness-webui.exe