name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        env:
          GOCACHE: ${{ runner.temp }}/go-build
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint
        with:
          version: v2.8.0
          only-new-issues: false
          args: --timeout=10m --enable=errcheck,govet,staticcheck,unused,ineffassign ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run tests
        env:
          GOCACHE: ${{ runner.temp }}/go-build
        run: go test -timeout 120s ./...

  race:
    name: Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run race tests
        env:
          GOCACHE: ${{ runner.temp }}/go-build
          GORACE: "halt_on_error=1"
        run: go test -race -timeout 120s ./...

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - name: Fuzz type decode
        env:
          GOCACHE: ${{ runner.temp }}/go-build
        run: go test -fuzz=FuzzTypeDecodeToValidation -fuzztime=60s -timeout=120s

      - name: Fuzz Lua source types
        env:
          GOCACHE: ${{ runner.temp }}/go-build
        run: go test -fuzz=FuzzLuaTypeValidation -fuzztime=60s -timeout=120s

      - name: Fuzz Lua with manifest
        env:
          GOCACHE: ${{ runner.temp }}/go-build
        run: go test -fuzz=FuzzLuaWithManifestTypes -fuzztime=60s -timeout=120s

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run benchmarks
        env:
          GOCACHE: ${{ runner.temp }}/go-build
        run: go test -bench="Benchmark(Validate|Is)" -benchmem -count=1 -timeout=60s | tee bench.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench.txt
