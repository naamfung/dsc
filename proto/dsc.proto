syntax = "proto3";

package dsc;

option go_package = "dsc/proto";

service DSCPluginService {
  rpc Name(NameRequest) returns (NameResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

service AgentService {
  rpc Run(RunRequest) returns (RunResponse);
  rpc RunStream(RunRequest) returns (stream RunStreamResponse);
  rpc Name(NameRequest) returns (NameResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc RegisterServices(RegisterServicesRequest) returns (RegisterServicesResponse);
  rpc SwitchSession(SwitchSessionRequest) returns (SwitchSessionResponse);
  rpc SetPlanMode(SetPlanModeRequest) returns (SetPlanModeResponse);
  rpc SetUserQuestionsService(SetUserQuestionsServiceRequest) returns (SetUserQuestionsServiceResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  // InjectMessage 将一条用户消息实时注入到当前运行的会话历史末端：
  // 模型在下一次 LLM 迭代即可看到，无需停止或等待本轮完成。
  rpc InjectMessage(InjectMessageRequest) returns (InjectMessageResponse);
  // DebugSnapshot 返回 agent 当前运行时的调试快照：会话历史（含实时注入的消息）、
  // token 用量、turn 计数与 plan/goal 状态。供 ADMIN API DEBUGGER 端点与自动化测试观察。
  rpc DebugSnapshot(DebugSnapshotRequest) returns (DebugSnapshotResponse);
}

service LLMService {
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc ChatStream(ChatRequest) returns (stream ChatStreamResponse);
  rpc Name(NameRequest) returns (NameResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

service ToolService {
  rpc ExecuteTool(ExecuteToolRequest) returns (ExecuteToolResponse);
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  // ListContext 返回插件贡献的上下文片段（如技能索引），宿主将其拼接到 agent 的 system prompt；
  // content 为空表示该插件无贡献。旧插件未实现时返回 Unimplemented，宿主应跳过。
  rpc ListContext(ListContextRequest) returns (ListContextResponse);
  // SetInterconnect 互通握手（机制 1/2/4）：宿主把挂载在本插件 client broker 上的
  // 聚合 LLM 服务、聚合 Tool 服务与插件通知服务的 serviceID 传给插件进程——插件经
  // 自身 broker.Dial 即可复用宿主 LLM 插件、调用宿主工具流水线（转发到任意工具插件）
  // 与事件总线，无需在插件启动时注入 env（避开握手时序）。
  // 旧插件未实现时返回 Unimplemented，宿主应跳过。
  rpc SetInterconnect(InterconnectRequest) returns (InterconnectResponse);
}

message InterconnectRequest {
  uint32 llm_service_id = 1;    // 聚合 LLM 服务 ID（0 = 未提供）
  uint32 notify_service_id = 2; // PluginNotifyService ID（0 = 未提供）
  uint32 tool_service_id = 3;   // 聚合 Tool 服务 ID（0 = 未提供；经宿主转发到任意工具插件）
}

message InterconnectResponse {}

message NameRequest {}
message NameResponse { string name = 1; }

message VersionRequest {}
message VersionResponse { string version = 1; }

message ExecuteRequest {
  string input = 1;
  map<string, string> params = 2;
}

message ExecuteResponse {
  string output = 1;
  string status = 2;
  string message = 3;
}

message HealthCheckRequest {}
message HealthCheckResponse {
  string status = 1;
  string message = 2;
}

message RunRequest {
  string input = 1;
}

message RunResponse {
  string output = 1;
  string status = 2;
}

// 流式运行响应：每帧携带一段增量输出，status 标记流的状态
message RunStreamResponse {
  string output = 1; // 增量输出（文本增量或工具调用提示）
  string status = 2; // "streaming" | "reasoning" | "tool" | "success" | "error"
  string error = 3;
  Usage usage = 4; // 本轮累计 token 用量（success 帧携带）
  string reasoning = 5; // 思考过程增量文本（status="reasoning" 帧携带）
  string tool_name = 6; // 工具调用帧（status="tool"）携带的工具名
  string tool_args = 7; // 工具调用帧携带的参数 JSON，供 TUI 渲染「● Verb(arg)」卡片
  string tool_result = 8; // 工具结果帧携带的结果内容，供 TUI 以「└」gutter 缩进展示
}

// token 用量统计（与 OpenAI usage 字段对应）
message Usage {
  int32 prompt_tokens = 1;     // 请求中提示（含历史）token 数
  int32 completion_tokens = 2; // 本轮生成的 token 数
  int32 total_tokens = 3;      // 合计
}

// --- LLM Service 消息定義 ---
message ChatRequest {
  repeated Message messages = 1;
  repeated Tool tools = 2;
  int32 max_tokens = 3; // 生成 token 上限（0 = 使用服务端默认；压缩等场景设置真实净余值）
}

message Message {
  string role = 1;    // "system", "user", "assistant", "tool"
  string content = 2;
  string tool_call_id = 3;   // 用于 tool 角色关联
  repeated ToolCall tool_calls = 4;  // 用于 assistant 角色回传工具调用（OpenAI 格式必需）
}

message Tool {
  string name = 1;
  string description = 2;
  string parameters_json = 3; // JSON Schema 字符串
}

message ChatResponse {
  string content = 1;
  string finish_reason = 2;   // "stop", "tool_calls"
  repeated ToolCall tool_calls = 3;
}

// 流式聊天响应：每帧携带一段增量内容；finish_reason 非空表示该轮结束
message ChatStreamResponse {
  string content = 1;         // 增量文本
  string finish_reason = 2;   // 非空表示该轮结束
  repeated ToolCall tool_calls = 3;
  string error = 4;           // 错误信息
  Usage usage = 5;            // 本轮的 token 用量（finish_reason 帧携带，需 stream_options.include_usage）
  string reasoning = 6;       // 思考过程增量文本（DeepSeek reasoning_content / Anthropic thinking 等）
}

message ToolCall {
  string id = 1;
  string name = 2;
  string arguments_json = 3;  // JSON 字符串
}

message RegisterServicesRequest {
  uint32 llm_service_id = 1;
  uint32 tool_service_id = 2;
}

message RegisterServicesResponse {
}

message SwitchSessionRequest {
  string session_id = 1; // 目标会话 id（如 "default"、"session-3"）
}

message SwitchSessionResponse {
  bool success = 1;
  string message = 2; // 错误信息（切换失败时）
}

message SetPlanModeRequest {
  bool active = 1; // 目标 plan 模式状态（true=进入 plan 模式，false=退出）
}

message SetPlanModeResponse {
  bool success = 1;
  string message = 2; // 错误信息（设置失败时）
}

message SetUserQuestionsServiceRequest {
  uint32 service_id = 1; // 宿主挂载在 broker 上的 UserQuestionsService ID（0 = 无通道）
}

message SetUserQuestionsServiceResponse {
  bool success = 1;
  string message = 2;
}

message InjectMessageRequest {
  string content = 1; // 注入的用户消息文本
}

message InjectMessageResponse {}

// DebugSnapshotRequest 查询 agent 运行时调试快照（空请求）。
message DebugSnapshotRequest {}

// DebugMessage 快照中派生历史里的一条消息（角色 + 内容）。
message DebugMessage {
  string role = 1;    // "system" | "user" | "assistant" | "tool"
  string content = 2;
}

// DebugSnapshotResponse agent 运行时调试快照。
message DebugSnapshotResponse {
  string session_id = 1;            // 当前会话 ID
  int32 turn_count = 2;             // 本轮会话起累计的 turn 计数
  bool plan_active = 3;             // 当前会话 plan 模式是否激活
  GoalDebugInfo goal = 4;           // 当前目标状态（未创建则为空/phase=inactive）
  int32 last_prompt_tokens = 5;     // 最近一次 LLM 请求的 prompt token ≈ 已用容量
  repeated DebugMessage messages = 6; // 派生的请求历史（含实时注入的用户消息）
}

// GoalDebugInfo 目标的调试信息（对齐 session.Goal 的可观察字段）。
message GoalDebugInfo {
  string phase = 1;                 // "inactive" | "active" | "concluded" 等
  int32 revision = 2;
  int32 max_rounds = 3;
  string activation = 4;            // "armed" | "disarmed"
  string objective = 5;
  int32 completed_steps = 6;
}

// UserQuestionsService 评审通道：agent 向宿主询问用户并阻塞等待回答（对齐 DSH user-questions）。
service UserQuestionsService {
  rpc Ask(AskRequest) returns (AskResponse);
}

// PluginNotifyService 插件→宿主事件通知（互通机制 2）：插件进程经 broker
// 连接，把事件（含后台任务完成通知）发布到宿主事件总线，供 TUI/其他插件订阅。
service PluginNotifyService {
  rpc Notify(NotifyRequest) returns (NotifyResponse);
}

message NotifyRequest {
  string owner = 1; // 调用方会话标识（空 = 无 owner）
  string name = 2;  // 宿主事件名（如 "job/done"；其余为插件自定义事件名）
  string data = 3;  // 事件数据（JSON 字符串；name 为 job/done 时须为任务快照）
}

message NotifyResponse {}

// PluginHookService 插件侧钩子/事件订阅服务（互通机制 3）：插件在自身 gRPC
// server 上注册，宿主在工具流水线与事件广播时回调。使插件 A 能在不通知
// 主程序和其他插件的情况下，钩子式改变插件 B 的工具行为（拦截/改写）。
service PluginHookService {
  // 工具执行前（宿主 pre-execute 流水线内，按插件加载顺序调用）：可 veto
  // 或改写参数；veto 阻止执行。
  rpc BeforeTool(BeforeToolRequest) returns (BeforeToolResponse);
  // 工具执行后：可改写结果/错误。
  rpc AfterTool(AfterToolRequest) returns (AfterToolResponse);
  // 宿主事件订阅：含其他插件经 PluginNotifyService 发布的事件。
  rpc OnEvent(OnEventRequest) returns (OnEventResponse);
}

message BeforeToolRequest {
  string tool_name = 1;
  string arguments_json = 2;
  string call_id = 3;
}

message BeforeToolResponse {
  bool veto = 1;             // 阻止执行
  string error = 2;          // veto/拦截原因
  string arguments_json = 3; // 改写后的参数（空 = 保持原样）
}

message AfterToolRequest {
  string tool_name = 1;
  string arguments_json = 2;
  string call_id = 3;
  string result = 4;
  string error = 5;
}

message AfterToolResponse {
  string result = 1; // 改写后的结果
  string error = 2;  // 改写后的错误
}

message OnEventRequest {
  string name = 1;
  string data_json = 2;
}

message OnEventResponse {}

message AskRequest {
  repeated AskQuestion questions = 1;
}

message AskQuestion {
  string id = 1;
  string question = 2;
  string detail = 3;   // 补充说明（如计划 markdown）
  string header = 4;   // 短标题/分组标签
  repeated AskOption options = 5;
  bool multi_select = 6;
  AskIntent intent = 7; // 呈现意图（如 plan-review），不影响回答编码
}

message AskOption {
  string label = 1;
  string description = 2;
}

message AskIntent {
  string kind = 1;     // "plan-review"
  string approve = 2;  // 批准计划的选项标签
}

message AskResponse {
  repeated AskAnswer answers = 1;
  string error = 2;    // 错误码（EMPTY_QUESTIONS/NO_PROVIDER/ASK_ABORTED 等）；空表示成功
  string message = 3;  // 错误详情
}

message AskAnswer {
  string id = 1;
  repeated string selected = 2; // 选中的选项标签
  string custom = 3;            // 自由文本 "Other" 回答
}

message ShutdownRequest {
  bool force = 1; // 是否強制關閉
}

message ShutdownResponse {
  bool success = 1;
  string message = 2;
}

message ExecuteToolRequest {
  string tool_name = 1;
  string arguments_json = 2;  // JSON string
  string tool_call_id = 3;   // 用于关联
  string session_id = 4;     // 调用方会话标识（owner 隔离：job 工具按此授权）
}

message ExecuteToolResponse {
  string content = 1;
  string error = 2;
}

message ListToolsRequest {
}

message ListToolsResponse {
  repeated Tool tools = 1;
}

message ListContextRequest {
}

message ListContextResponse {
  string content = 1; // 插件贡献的上下文片段，可注入 system prompt；空表示无贡献
}

// FsObservationPolicyService 文件系統觀測策略服務
service FsObservationPolicyService {
  rpc GetObservation(GetObservationRequest) returns (GetObservationResponse);
  rpc UpdateObservation(UpdateObservationRequest) returns (UpdateObservationResponse);
}

message FsObservation {
  string state = 1; // "unseen", "absent", "present"
  string version = 2; // 文件的內容 hash 或最後修改時間戳
  string last_content = 3; // 最後一次觀測到的文件內容（可選）
}

message GetObservationRequest {
  string file_path = 1;
}

message GetObservationResponse {
  FsObservation observation = 1;
  bool found = 2;
}

message UpdateObservationRequest {
  string file_path = 1;
  FsObservation observation = 2;
}

message UpdateObservationResponse {
  bool success = 1;
  string message = 2;
}