name: 创造模式
description: 标准模式的派生模式——加入插件创造能力：模型需要新能力时，经 tool-lua-host 编写 LUA 脚本注册新工具，而非要求宿主改主程序（内置 lua-plugin-creator SKILL 提供完整指导）。
persona: "You are an AI agent powered by DSC, running in CREATION mode. When you need a capability that no existing tool provides, create a new Lua plugin for tool-lua-host by writing a script (scripts/<name>/main.lua) and registering tools with dsc.register_tool. Follow the lua-plugin-creator skill for the full workflow, API reference and best practices. Prefer composing existing tools first; only create a plugin when composition is insufficient."
plan_section: "You are in creation mode. When a task needs a new capability, first design a Lua plugin: decide which tools to register, which dsc.* services (llm/tool/notify/store/hook/job) they will use, and the parameter schemas. Present the complete design through exit_plan_mode before writing the script. Read the lua-plugin-creator skill first if you haven't."
plugins:
  # ===== 继承标准模式（standard）的全部插件 =====
  # 外置决策插件：超长工具结果外置为文件（阈值 DSC_SPILL_THRESHOLD 字符，0 禁用；取回走 view）
  - name: policy-spill
    type: policy
    enabled: true
  # 核心插件混合体（dsc-system 驻留）：
  #   - fs-observation 读前改写策略：str_replace/insert 前必须有本会话内先读
  #     记录，文件被外部修改后拦截（sha256 新鲜度校验）
  #   - timeout 超时决策：shell/subagent 活跃续命空闲预算
  #     （DSC_SHELL_TIMEOUT / DSC_SUBAGENT_IDLE_TIMEOUT，0s 禁用）
  #   - 重复工具调用提醒（advisory）：连续同参重复调用达阈值时注入提醒
  #     （DSC_REPEAT_THRESHOLDS 缺省 3,5,8 / DSC_REPEAT_EXCLUDE
  #     缺省 todo_write）；不否决不改写，用户插话自动重置
  - name: dsc-system
    type: dsc
    enabled: true
  - name: tool-str-replace-editor
    type: tool
    enabled: true
  - name: tool-filesystem
    type: tool
    enabled: true
  - name: tool-browser-use
    type: tool
    enabled: true
  - name: tool-computer-use
    type: tool
    enabled: true
  - name: tool-lisp-eval
    type: tool
    enabled: true
  - name: tool-skill
    type: tool
    enabled: true
  # 通知音效（回合完成程序性响铃）
  - name: dsc-notify
    type: dsc
    enabled: true
  # ===== 插件创造核心：LUA HOST（脚本经 dsc.register_tool 注册工具） =====
  - name: tool-lua-host
    type: tool
    enabled: true
    binary_path: ./plugins/tool-lua-host/tool-lua-host.exe
