name: 标准模式
description: 包含所有可用工具，支持完整的 Agent 能力。
persona: "You are a helpful software engineer assistant."
plan_section: "You are in plan mode. Explore and design before presenting the complete plan through exit_plan_mode."
# 压缩后端（配置层缺省启用）：dsc-system 声明 Provides compaction 能力，缺省选中
# 即免「插件依赖压缩能力而未配置」的启动阻塞；亦可选 dsc-billion-context
compaction: dsc-system
plugins:
  # 核心插件混合体（dsc-system 驻留）：
  #   - fs-observation 读前改写策略：str_replace/insert 前必须有本会话内先读
  #     记录，文件被外部修改后拦截（sha256 新鲜度校验）
  #   - timeout 超时决策：shell/subagent 活跃续命空闲预算
  #     （DSC_SHELL_TIMEOUT / DSC_SUBAGENT_IDLE_TIMEOUT，0s 禁用）
  #   - spill 外置决策：超长工具结果全文落盘，模型侧只见头尾预览 + 定位符
  #     + 取回指引（阈值 DSC_SPILL_THRESHOLD 字符，0 禁用；取回走 view）
  #   - skill 技能工具（自 tool-skill 迁入）：skill / install_skill /
  #     uninstall_skill + ContextFn 注入技能索引（DSC_SKILLS_DIR 可调）
  #   - 重复工具调用提醒（advisory）：连续同参重复调用达阈值时注入提醒
  #     （DSC_REPEAT_THRESHOLDS 缺省 3,5,8 / DSC_REPEAT_EXCLUDE
  #     缺省 todo_write）；不否决不改写，用户插话自动重置
  - name: dsc-system
    type: dsc
    enabled: true
  - name: tool-str-replace-editor
    type: tool
    enabled: true
  - name: tool-filesystem
    type: tool
    enabled: true
  - name: tool-browser-use
    type: tool
    enabled: true
  # - name: tool-computer-use
  #   type: tool
  #   enabled: true
  - name: tool-lisp-eval
    type: tool
    enabled: true
  # 通知音效插件：回合完成时宿主自动播放 success 音效（程序性，经 Hook 订阅 agent/status 事件）
  - name: dsc-notify
    type: dsc
    enabled: true
  # LUA HOST：空壳工具插件，加载 LUA 脚本（运行已创建的工具；新脚本仅在创造模式生效）
  - name: tool-lua-host
    type: tool
    enabled: true
    binary_path: ./plugins/tool-lua-host/tool-lua-host.exe
  # WEB UI：独立工具插件，自带 SvelteKit 前端（bun 构建后 go:embed 嵌入），独立 HTTP 端口代理宿主 admin
  # - name: tool-harness-webui
  #   type: tool
  #   enabled: true
  #   binary_path: ./plugins/tool-harness-webui/tool-harness-webui.exe
