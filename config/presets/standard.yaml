name: 标准模式
description: 包含所有可用工具，支持完整的 Agent 能力。
persona: "You are a helpful software engineer assistant."
plan_section: "You are in plan mode. Explore and design before presenting the complete plan through exit_plan_mode."
plugins:
  - name: policy-fs-observation
    type: policy
    enabled: true
  - name: tool-str-replace-editor
    type: tool
    enabled: true
  - name: tool-filesystem
    type: tool
    enabled: true
  - name: tool-browser-use
    type: tool
    enabled: true
  - name: tool-lisp-eval
    type: tool
    enabled: true
  - name: tool-skill
    type: tool
    enabled: true
  # 内部使用：逆推情节生成小说工具插件（经互通机制 1 复用宿主 LLM）
  - name: tool-novelforge
    type: tool
    enabled: true
    binary_path: ./plugins/tool-novelforge/novelforge.exe
  # LUA HOST：空壳工具插件，加载 LUA 脚本（运行已创建的工具；新脚本仅在创造模式生效）
  - name: tool-lua-host
    type: tool
    enabled: true
    binary_path: ./plugins/tool-lua-host/lua-host.exe
