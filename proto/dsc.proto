syntax = "proto3";

package dsc;

option go_package = "dsc/proto";

service DSCPluginService {
  rpc Name(NameRequest) returns (NameResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

service AgentService {
  rpc Run(RunRequest) returns (RunResponse);
  rpc RunStream(RunRequest) returns (stream RunStreamResponse);
  rpc Name(NameRequest) returns (NameResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc RegisterServices(RegisterServicesRequest) returns (RegisterServicesResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

service LLMService {
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc ChatStream(ChatRequest) returns (stream ChatStreamResponse);
  rpc Name(NameRequest) returns (NameResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

service ToolService {
  rpc ExecuteTool(ExecuteToolRequest) returns (ExecuteToolResponse);
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  // ListContext 返回插件贡献的上下文片段（如技能索引），宿主将其拼接到 agent 的 system prompt；
  // content 为空表示该插件无贡献。旧插件未实现时返回 Unimplemented，宿主应跳过。
  rpc ListContext(ListContextRequest) returns (ListContextResponse);
}

message NameRequest {}
message NameResponse { string name = 1; }

message VersionRequest {}
message VersionResponse { string version = 1; }

message ExecuteRequest {
  string input = 1;
  map<string, string> params = 2;
}

message ExecuteResponse {
  string output = 1;
  string status = 2;
  string message = 3;
}

message HealthCheckRequest {}
message HealthCheckResponse {
  string status = 1;
  string message = 2;
}

message RunRequest {
  string input = 1;
}

message RunResponse {
  string output = 1;
  string status = 2;
}

// 流式运行响应：每帧携带一段增量输出，status 标记流的状态
message RunStreamResponse {
  string output = 1; // 增量输出（文本增量或工具调用提示）
  string status = 2; // "streaming" | "reasoning" | "tool" | "success" | "error"
  string error = 3;
  Usage usage = 4; // 本轮累计 token 用量（success 帧携带）
  string reasoning = 5; // 思考过程增量文本（status="reasoning" 帧携带）
  string tool_name = 6; // 工具调用帧（status="tool"）携带的工具名
  string tool_args = 7; // 工具调用帧携带的参数 JSON，供 TUI 渲染「● Verb(arg)」卡片
  string tool_result = 8; // 工具结果帧携带的结果内容，供 TUI 以「└」gutter 缩进展示
}

// token 用量统计（与 OpenAI usage 字段对应）
message Usage {
  int32 prompt_tokens = 1;     // 请求中提示（含历史）token 数
  int32 completion_tokens = 2; // 本轮生成的 token 数
  int32 total_tokens = 3;      // 合计
}

// --- LLM Service 消息定義 ---
message ChatRequest {
  repeated Message messages = 1;
  repeated Tool tools = 2;
  int32 max_tokens = 3; // 生成 token 上限（0 = 使用服务端默认；压缩等场景设置真实净余值）
}

message Message {
  string role = 1;    // "system", "user", "assistant", "tool"
  string content = 2;
  string tool_call_id = 3;   // 用于 tool 角色关联
  repeated ToolCall tool_calls = 4;  // 用于 assistant 角色回传工具调用（OpenAI 格式必需）
}

message Tool {
  string name = 1;
  string description = 2;
  string parameters_json = 3; // JSON Schema 字符串
}

message ChatResponse {
  string content = 1;
  string finish_reason = 2;   // "stop", "tool_calls"
  repeated ToolCall tool_calls = 3;
}

// 流式聊天响应：每帧携带一段增量内容；finish_reason 非空表示该轮结束
message ChatStreamResponse {
  string content = 1;         // 增量文本
  string finish_reason = 2;   // 非空表示该轮结束
  repeated ToolCall tool_calls = 3;
  string error = 4;           // 错误信息
  Usage usage = 5;            // 本轮的 token 用量（finish_reason 帧携带，需 stream_options.include_usage）
  string reasoning = 6;       // 思考过程增量文本（DeepSeek reasoning_content / Anthropic thinking 等）
}

message ToolCall {
  string id = 1;
  string name = 2;
  string arguments_json = 3;  // JSON 字符串
}

message RegisterServicesRequest {
  uint32 llm_service_id = 1;
  uint32 tool_service_id = 2;
}

message RegisterServicesResponse {
}

message ShutdownRequest {
  bool force = 1; // 是否強制關閉
}

message ShutdownResponse {
  bool success = 1;
  string message = 2;
}

message ExecuteToolRequest {
  string tool_name = 1;
  string arguments_json = 2;  // JSON string
  string tool_call_id = 3;   // 用于关联
}

message ExecuteToolResponse {
  string content = 1;
  string error = 2;
}

message ListToolsRequest {
}

message ListToolsResponse {
  repeated Tool tools = 1;
}

message ListContextRequest {
}

message ListContextResponse {
  string content = 1; // 插件贡献的上下文片段，可注入 system prompt；空表示无贡献
}

// FsObservationPolicyService 文件系統觀測策略服務
service FsObservationPolicyService {
  rpc GetObservation(GetObservationRequest) returns (GetObservationResponse);
  rpc UpdateObservation(UpdateObservationRequest) returns (UpdateObservationResponse);
}

message FsObservation {
  string state = 1; // "unseen", "absent", "present"
  string version = 2; // 文件的內容 hash 或最後修改時間戳
  string last_content = 3; // 最後一次觀測到的文件內容（可選）
}

message GetObservationRequest {
  string file_path = 1;
}

message GetObservationResponse {
  FsObservation observation = 1;
  bool found = 2;
}

message UpdateObservationRequest {
  string file_path = 1;
  FsObservation observation = 2;
}

message UpdateObservationResponse {
  bool success = 1;
  string message = 2;
}