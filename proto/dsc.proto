syntax = "proto3";

package dsc;

option go_package = "dsc/proto";

service DSCPluginService {
  rpc Name(NameRequest) returns (NameResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

service AgentService {
  rpc Run(RunRequest) returns (RunResponse);
  rpc Name(NameRequest) returns (NameResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc SetLLMServiceID(SetLLMServiceIDRequest) returns (SetLLMServiceIDResponse);
}

service LLMService {
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc Name(NameRequest) returns (NameResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message NameRequest {}
message NameResponse { string name = 1; }

message VersionRequest {}
message VersionResponse { string version = 1; }

message ExecuteRequest {
  string input = 1;
  map<string, string> params = 2;
}

message ExecuteResponse {
  string output = 1;
  string status = 2;
  string message = 3;
}

message HealthCheckRequest {}
message HealthCheckResponse {
  string status = 1;
  string message = 2;
}

message RunRequest {
  string input = 1;
}

message RunResponse {
  string output = 1;
  string status = 2;
}

// --- LLM Service 消息定義 ---
message ChatRequest {
  repeated Message messages = 1;
  repeated Tool tools = 2;
}

message Message {
  string role = 1;    // "system", "user", "assistant", "tool"
  string content = 2;
}

message Tool {
  string name = 1;
  string description = 2;
  string parameters_json = 3; // JSON Schema 字符串
}

message ChatResponse {
  string content = 1;
  string finish_reason = 2;   // "stop", "tool_calls"
  repeated ToolCall tool_calls = 3;
}

message ToolCall {
  string name = 1;
  string arguments_json = 2;  // JSON 字符串
}

message SetLLMServiceIDRequest {
  uint32 service_id = 1;
}

message SetLLMServiceIDResponse {
}