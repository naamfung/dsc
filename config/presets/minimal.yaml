name: 极简模式
description: 仅提供持久 bash 与 str_replace_editor 的双工具编码 Agent。
plugins:
  - name: llm-openai
    type: llm
    enabled: true
  - name: react-loop
    type: agent
    enabled: true
  - name: tool-str-replace-editor
    type: tool
    enabled: true
  - name: tool-filesystem
    type: tool
    enabled: true
  - name: fs-observation-policy
    type: policy
    enabled: true
